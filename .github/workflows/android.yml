name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install Android Build Tools
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest --stacktrace

    - name: Verify APK was produced
      run: |
        ls -lh app/build/outputs/apk/debug/
        du -h app/build/outputs/apk/debug/*.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: devcode-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Create GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: DEVCODE build ${{ github.run_number }}
        body: |
          Automated debug APK build from CI run ${{ github.run_number }}.
          Commit: ${{ github.sha }}
        files: app/build/outputs/apk/debug/*.apk
