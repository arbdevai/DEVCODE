name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install Android Build Tools
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    # --- Deterministic CI release keystore (NOT production secrets) ---
    # The same keystore + fingerprint must ship in the repo so every CI build
    # produces an APK signed by the SAME certificate — otherwise Android treats
    # each build-N release as a different app and blocks re-install/updates.
    - name: Restore CI signing keystore
      run: |
        python3 - <<'PYEOF'
        import base64, pathlib
        keystore = pathlib.Path("app/ci-release.keystore")
        if keystore.exists():
            print("keystore already present, skipping")
        else:
            print("MISSING app/ci-release.keystore - build will fail; commit it to the repo")
            raise SystemExit(1)
        PYEOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest --stacktrace

    - name: Verify APK signatures (v1+v2+v3) and fingerprint
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
        APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
        echo "APK: $APK"
        ls -lh "$APK"
        "$APKSIGNER" verify --verbose --print-certs "$APK"
        echo "--- fingerprint (must stay constant across builds) ---"
        "$APKSIGNER" verify --print-certs "$APK" | grep -E "SHA-256|SHA-1" | sort -u

    - name: Verify APK was produced
      run: |
        ls -lh app/build/outputs/apk/debug/
        du -h app/build/outputs/apk/debug/*.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: devcode-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Create GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: DEVCODE build ${{ github.run_number }}
        body: |
          Automated debug APK build from CI run ${{ github.run_number }}.
          Commit: ${{ github.sha }}

          The APK is signed with the stable CI release key (v1+v2+v3 enabled),
          so it can be installed as an update over previous DEVCODE builds.
        files: app/build/outputs/apk/debug/*.apk
